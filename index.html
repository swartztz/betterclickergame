<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buisness Life</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Buisness Life</h1>
        <div class="score">
            <p>Money: <span id="points">0</span></p>
        </div>
        <button id="clickButton">Work</button>
        <div class="upgrades">
            <h2>Upgrades</h2>
            <button id="upgradeButton1">Drop Shipping (Cost: $75)</button>
            <button id="upgradeButton2">Online Clothing Store (Cost: $100)</button>
            <button id="upgradeButton3">Taxi Buisness (Cost: $10,000)</button>
            <button id="upgradeButton4">Factory (Cost: $400,000)</button>
        </div>
        <div id="popup" class="popup"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
